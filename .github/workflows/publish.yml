name: Publish package

# Publishes @tjakoen/batch to the PUBLIC npm registry when its version changes. Bump the version
# in package.json and push to main: this publishes it and skips a version already on the registry
# (so ordinary commits are a no-op).
#
# Auth is npm TRUSTED PUBLISHING (OIDC) — there is NO token anywhere in this workflow. npm trusts
# this specific repo + workflow filename, configured per package at
# npmjs.com/package/@tjakoen/batch/access. Renaming this file breaks the trust relationship until
# the publisher config is updated to match.
#
# Three things this job must NOT do, each of which silently disables the OIDC exchange:
#
#  1. Set `registry-url` on setup-node. It writes an .npmrc line
#     `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`; with no token set that expands to
#     EMPTY, npm reads it as "auth is already configured" and never performs the token exchange.
#     (Same shape as the committed `_authToken=${GITHUB_TOKEN}` that used to 401 every cold
#     install — an empty auth value overriding a working default.) See actions/setup-node#1551.
#  2. Set NODE_AUTH_TOKEN at all, empty or otherwise.
#  3. Run on npm older than 11.5.1, which predates OIDC support. Node 24 ships a new enough npm,
#     but the explicit upgrade keeps this true regardless of what the runner image changes to.
#
# --provenance is passed explicitly: the docs say public-repo provenance is automatic, but it has
# been reported not to fire without the flag, and passing it makes the failure loud rather than
# a silently unsigned package.
#
# --@tjakoen:registry is belt-and-braces. Nothing writes an .npmrc here now, but a scope mapping
# beats both publishConfig and --registry, so pinning it keeps a future added step from
# retargeting this job (and `npm view` from reporting another registry's versions).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for trusted publishing

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # trusted publishing needs Node >= 22.14
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - name: Publish if the version is new
        run: |
          set -euo pipefail
          reg=--@tjakoen:registry=https://registry.npmjs.org
          v=$(node -p "require('./package.json').version")
          if npm view "$reg" "@tjakoen/batch@$v" version >/dev/null 2>&1; then
            echo "@tjakoen/batch@$v already published — skipping"
          else
            echo "Publishing @tjakoen/batch@$v"
            npm publish "$reg" --access public --provenance
          fi
